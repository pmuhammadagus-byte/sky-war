<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Sky War - Modern Space Battle</title>
    <style>
        body { margin: 0; background: #020617; overflow: hidden; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; }
        .score { font-size: 24px; font-weight: bold; color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        #menu { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.9); padding: 2rem; border-radius: 1.5rem;
            text-align: center; border: 2px solid #334155; backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); display: none;
        }
        h1 { margin: 0 0 1rem; color: #38bdf8; font-size: 3rem; letter-spacing: -2px; }
        button { 
            background: #38bdf8; color: #0f172a; border: none; padding: 0.8rem 2rem;
            font-size: 1.2rem; font-weight: bold; border-radius: 0.75rem; cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { background: #7dd3fc; transform: scale(1.05); }
    </style>
</head>
<body>
    <div id="ui">
        <div class="score">SCORE: <span id="scoreVal">0</span></div>
    </div>
    <div id="menu">
        <h1 id="menuTitle">SKY WAR</h1>
        <p id="menuText">Gunakan Mouse atau Touch untuk menggerakkan pesawat dan menembak.</p>
        <button id="startBtn">START MISSION</button>
    </div>
    <canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal'), menu = document.getElementById('menu');
const startBtn = document.getElementById('startBtn'), menuTitle = document.getElementById('menuTitle');

let w, h, player, stars = [], bullets = [], enemies = [], particles = [], score = 0, playing = false;

class Player {
    constructor() {
        this.w = 50; this.h = 50;
        this.x = w / 2; this.y = h - 100;
        this.targetX = this.x;
        this.color = '#38bdf8';
    }
    draw() {
        this.x += (this.targetX - this.x) * 0.2;
        // Shadow/Glow
        ctx.shadowBlur = 15; ctx.shadowColor = this.color;
        // Jet Body
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - 20);
        ctx.lineTo(this.x - 20, this.y + 20);
        ctx.lineTo(this.x + 20, this.y + 20);
        ctx.fill();
        // Cockpit
        ctx.fillStyle = '#fff';
        ctx.fillRect(this.x - 4, this.y - 5, 8, 10);
        ctx.shadowBlur = 0;
    }
}

class Enemy {
    constructor() {
        this.w = 40; this.h = 40;
        this.x = Math.random() * (w - this.w) + this.w / 2;
        this.y = -50;
        this.speed = 2 + Math.random() * 3 + (score / 200);
        this.hp = 1;
        this.color = '#f43f5e';
    }
    update() {
        this.y += this.speed;
        ctx.shadowBlur = 10; ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y + 20);
        ctx.lineTo(this.x - 15, this.y - 15);
        ctx.lineTo(this.x + 15, this.y - 15);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

class Bullet {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.speed = 15;
    }
    update() {
        this.y -= this.speed;
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(this.x - 2, this.y, 4, 15);
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y;
        this.v = { x: (Math.random() - 0.5) * 8, y: (Math.random() - 0.5) * 8 };
        this.a = 1;
        this.color = color;
    }
    update() {
        this.x += this.v.x; this.y += this.v.y;
        this.a -= 0.02;
        ctx.globalAlpha = this.a;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, 3, 3);
        ctx.globalAlpha = 1;
    }
}

function init() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    player = new Player();
    stars = Array(100).fill().map(() => ({ x: Math.random() * w, y: Math.random() * h, s: Math.random() * 2 }));
    menu.style.display = 'block';
}

function spawnEnemy() {
    if (playing && Math.random() < 0.03 + (score / 5000)) enemies.push(new Enemy());
}

function explode(x, y, color) {
    for (let i = 0; i < 15; i++) particles.push(new Particle(x, y, color));
}

function gameOver() {
    playing = false;
    menuTitle.innerText = "MISSION FAILED";
    menuTitle.style.color = "#f43f5e";
    menu.style.display = 'block';
    startBtn.innerText = "RETRY";
}

function loop() {
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, w, h);

    // Stars background
    ctx.fillStyle = '#ffffff33';
    stars.forEach(s => {
        s.y += s.s;
        if (s.y > h) s.y = 0;
        ctx.fillRect(s.x, s.y, 1, 1);
    });

    if (playing) {
        player.draw();
        spawnEnemy();

        bullets.forEach((b, i) => {
            b.update();
            if (b.y < -20) bullets.splice(i, 1);
        });

        enemies.forEach((e, i) => {
            e.update();
            if (e.y > h + 50) enemies.splice(i, 1);

            // Collision Enemy-Player
            const dist = Math.hypot(e.x - player.x, e.y - player.y);
            if (dist < 30) {
                explode(player.x, player.y, '#38bdf8');
                explode(e.x, e.y, '#f43f5e');
                gameOver();
            }

            // Collision Enemy-Bullet
            bullets.forEach((b, bi) => {
                if (Math.hypot(e.x - b.x, e.y - b.y) < 25) {
                    explode(e.x, e.y, '#f43f5e');
                    enemies.splice(i, 1);
                    bullets.splice(bi, 1);
                    score += 10;
                    scoreEl.innerText = score;
                }
            });
        });
    }

    particles.forEach((p, i) => {
        p.update();
        if (p.a <= 0) particles.splice(i, 1);
    });

    requestAnimationFrame(loop);
}

const handle = (clientX) => {
    if (!playing) return;
    player.targetX = clientX;
};

const shoot = () => {
    if (!playing) return;
    bullets.push(new Bullet(player.x, player.y - 20));
};

startBtn.onclick = () => {
    score = 0; scoreEl.innerText = 0;
    enemies = []; bullets = []; particles = [];
    player.x = w / 2; player.targetX = w / 2;
    menu.style.display = 'none';
    playing = true;
};

window.addEventListener('mousemove', e => handle(e.clientX));
window.addEventListener('touchmove', e => { e.preventDefault(); handle(e.touches[0].clientX); }, { passive: false });
window.addEventListener('mousedown', shoot);
window.addEventListener('touchstart', shoot);

window.onresize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };

init();
loop();
</script>
</body>
</html>
